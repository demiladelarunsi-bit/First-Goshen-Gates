{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CBT Exam — First Goshen Gate</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config={theme:{extend:{colors:{blue:'#4f8cff','blue-light':'#8bb5ff',dark:'#060a14'},fontFamily:{display:['"Space Grotesk"','sans-serif'],body:['"DM Sans"','sans-serif']}}}}</script>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=DM+Sans:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root{--blue:#4f8cff;--blue-light:#8bb5ff;--dark:#060a14;--card:rgba(10,16,30,0.8);--border:rgba(79,140,255,0.12);--border-hover:rgba(79,140,255,0.35);--glow:0 0 20px rgba(79,140,255,0.12);--green:#4fff8c;--red:#ff465a;--orange:#ffb432}
        *{box-sizing:border-box;margin:0;padding:0}body{font-family:'DM Sans',sans-serif;background:var(--dark);color:#c8cdd8;overflow-x:hidden;min-height:100vh}
        #loader{position:fixed;inset:0;z-index:9999;background:var(--dark);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:1.5rem;transition:opacity .5s,visibility .5s}
        #loader.done{opacity:0;visibility:hidden;pointer-events:none}
        .loader-morph{width:50px;height:50px;background:linear-gradient(135deg,var(--blue),var(--blue-light));animation:morph 1.2s ease-in-out infinite}
        @keyframes morph{0%{border-radius:50%;transform:rotate(0) scale(1)}25%{border-radius:30% 70% 70% 30%/30% 30% 70% 70%;transform:rotate(90deg) scale(1.1)}50%{border-radius:50%;transform:rotate(180deg)}75%{border-radius:70% 30% 30% 70%/70% 70% 30% 30%;transform:rotate(270deg) scale(1.1)}100%{border-radius:50%;transform:rotate(360deg) scale(1)}}
        .loader-text{font-family:'Space Grotesk',sans-serif;font-size:.75rem;font-weight:600;color:#3a4a6a;text-transform:uppercase;letter-spacing:3px}
        .grid-bg{position:fixed;inset:0;z-index:0;pointer-events:none;background-image:linear-gradient(rgba(79,140,255,0.02) 1px,transparent 1px),linear-gradient(90deg,rgba(79,140,255,0.02) 1px,transparent 1px);background-size:70px 70px;animation:gp 6s ease-in-out infinite}
        @keyframes gp{0%,100%{opacity:.5}50%{opacity:1}}
        .glass{background:var(--card);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid var(--border);border-radius:16px;box-shadow:var(--glow)}
        #navbar{position:fixed;top:0;left:0;right:0;z-index:100;padding:0 2rem;height:70px;display:flex;align-items:center;justify-content:space-between;background:rgba(6,10,20,0.85);backdrop-filter:blur(24px);border-bottom:1px solid var(--border)}
        .nav-logo{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:1.5rem;background:linear-gradient(135deg,var(--blue),var(--blue-light));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;text-decoration:none}
        .nav-right{display:flex;align-items:center;gap:1rem}
        .timer-box{display:flex;align-items:center;gap:.5rem;padding:.5rem 1.25rem;border-radius:10px;background:rgba(79,140,255,0.08);border:1px solid var(--border)}
        .timer-box i{color:var(--blue);font-size:.9rem}
        .timer-box span{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:1.1rem;color:#fff;min-width:70px;text-align:center}
        .timer-box.warning{border-color:rgba(255,180,50,0.4);background:rgba(255,180,50,0.08)}
        .timer-box.warning span{color:var(--orange)}
        .timer-box.danger{border-color:rgba(255,70,90,0.4);background:rgba(255,70,90,0.08);animation:tp 1s ease-in-out infinite}
        .timer-box.danger span{color:var(--red)}
        @keyframes tp{0%,100%{opacity:1}50%{opacity:.6}}
        .progress-bar{height:3px;background:rgba(79,140,255,0.1);border-radius:3px;overflow:hidden;flex:1;max-width:200px}
        .progress-fill{height:100%;background:linear-gradient(90deg,var(--blue),var(--blue-light));border-radius:3px;transition:width .3s ease}

        #exam-wrap{position:relative;z-index:2;padding:90px 1.5rem 3rem;max-width:720px;margin:0 auto}
        .exam-header{text-align:center;margin-bottom:2rem}
        .exam-subject{font-family:'Space Grotesk',sans-serif;font-size:clamp(1.3rem,3vw,1.8rem);font-weight:700;color:#fff;margin-bottom:.25rem}
        .exam-info{color:#5a6a8a;font-size:.85rem}
        .exam-info span{color:var(--blue-light);font-weight:600}

        /* STUDENT INFO MODAL */
        .modal-overlay{position:fixed;inset:0;z-index:200;background:rgba(6,10,20,0.9);backdrop-filter:blur(10px);display:flex;align-items:center;justify-content:center;padding:1.5rem;animation:fi .3s ease}
        @keyframes fi{from{opacity:0}to{opacity:1}}
        .modal-card{width:100%;max-width:420px;padding:2.5rem;animation:cu .4s cubic-bezier(.16,1,.3,1) forwards;opacity:0;transform:translateY(30px) scale(.95)}
        @keyframes cu{to{opacity:1;transform:translateY(0) scale(1)}}
        .modal-card h2{font-family:'Space Grotesk',sans-serif;font-size:1.3rem;font-weight:700;color:#fff;margin-bottom:.25rem;text-align:center}
        .modal-card p{color:#5a6a8a;font-size:.85rem;text-align:center;margin-bottom:1.5rem}
        .form-group{position:relative;margin-bottom:1.25rem}
        .form-group input{width:100%;padding:1rem 1rem .75rem;background:rgba(255,255,255,0.03);border:1.5px solid var(--border);border-radius:12px;color:#e0e4ed;font-family:'DM Sans',sans-serif;font-size:.95rem;outline:none;transition:all .3s}
        .form-group input:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(79,140,255,0.1);background:rgba(79,140,255,0.03)}
        .form-group label{position:absolute;top:.85rem;left:1rem;color:#4a5a7a;font-size:.95rem;pointer-events:none;transition:all .25s;transform-origin:left}
        .form-group input:focus~label,.form-group input:not(:placeholder-shown)~label{top:-.5rem;left:.75rem;font-size:.7rem;color:var(--blue);background:var(--dark);padding:0 .35rem;font-weight:600;letter-spacing:.5px}

        /* QUESTION CARD */
        .q-card{padding:2rem;margin-bottom:1.25rem;animation:cu .4s cubic-bezier(.16,1,.3,1) forwards;opacity:0}
        .q-num{font-family:'Space Grotesk',sans-serif;font-size:.7rem;font-weight:700;color:var(--blue);text-transform:uppercase;letter-spacing:2px;margin-bottom:1rem}
        .q-text{font-size:1.05rem;color:#e0e4ed;line-height:1.7;margin-bottom:1.5rem;font-weight:500}
        .q-options{display:flex;flex-direction:column;gap:.6rem}
        .q-opt{display:flex;align-items:center;gap:1rem;padding:1rem 1.25rem;border-radius:12px;border:1.5px solid var(--border);cursor:pointer;transition:all .25s;user-select:none}
        .q-opt:hover{border-color:var(--border-hover);background:rgba(79,140,255,0.03)}
        .q-opt.selected{border-color:var(--blue);background:rgba(79,140,255,0.08);box-shadow:0 0 0 3px rgba(79,140,255,0.1)}
        .q-opt.correct{border-color:var(--green);background:rgba(79,255,140,0.06)}
        .q-opt.wrong{border-color:var(--red);background:rgba(255,70,90,0.06)}
        .q-opt-letter{width:32px;height:32px;border-radius:8px;background:rgba(79,140,255,0.08);display:flex;align-items:center;justify-content:center;font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:.85rem;color:var(--blue);flex-shrink:0;transition:all .25s}
        .q-opt.selected .q-opt-letter{background:var(--blue);color:#fff}
        .q-opt.correct .q-opt-letter{background:var(--green);color:#060a14}
        .q-opt.wrong .q-opt-letter{background:var(--red);color:#fff}
        .q-opt-text{color:#c8cdd8;font-size:.95rem;flex:1}
        .q-opt-icon{font-size:.9rem;opacity:0;transition:opacity .3s}
        .q-opt.correct .q-opt-icon{opacity:1;color:var(--green)}
        .q-opt.wrong .q-opt-icon{opacity:1;color:var(--red)}
        .q-fill-input{width:100%;padding:1rem;background:rgba(255,255,255,0.03);border:1.5px solid var(--border);border-radius:12px;color:#e0e4ed;font-family:'DM Sans',sans-serif;font-size:1rem;outline:none;transition:all .3s}
        .q-fill-input:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(79,140,255,0.1);background:rgba(79,140,255,0.03)}
        .q-fill-input.correct{border-color:var(--green);background:rgba(79,255,140,0.05)}
        .q-fill-input.wrong{border-color:var(--red);background:rgba(255,70,90,0.05)}

        /* NAV BUTTONS */
        .q-nav{display:flex;justify-content:space-between;align-items:center;margin-top:1.5rem}
        .q-dots{display:flex;flex-wrap:wrap;gap:.4rem;justify-content:center;margin-bottom:1.5rem}
        .q-dot{width:32px;height:32px;border-radius:8px;background:rgba(255,255,255,0.03);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-family:'Space Grotesk',sans-serif;font-size:.75rem;font-weight:600;color:#4a5a7a;cursor:pointer;transition:all .2s}
        .q-dot:hover{border-color:var(--border-hover);color:#6b7a99}
        .q-dot.active{background:rgba(79,140,255,0.1);border-color:var(--blue);color:var(--blue)}
        .q-dot.answered{background:rgba(79,140,255,0.15);border-color:rgba(79,140,255,0.3);color:var(--blue-light)}
        .q-dot.dot-correct{background:rgba(79,255,140,0.1);border-color:rgba(79,255,140,0.3);color:var(--green)}
        .q-dot.dot-wrong{background:rgba(255,70,90,0.1);border-color:rgba(255,70,90,0.3);color:var(--red)}

        /* RESULT CARD */
        .result-card{text-align:center;padding:3rem 2rem;animation:si .6s cubic-bezier(.16,1,.3,1) forwards;opacity:0;transform:scale(.95)}
        @keyframes si{to{opacity:1;transform:scale(1)}}
        .result-score{font-family:'Space Grotesk',sans-serif;font-size:4rem;font-weight:700;margin-bottom:.25rem}
        .result-score.excellent{color:var(--green)}
        .result-score.good{color:var(--blue)}
        .result-score.average{color:var(--orange)}
        .result-score.poor{color:var(--red)}
        .result-label{color:#5a6a8a;font-size:.9rem;margin-bottom:2rem}
        .result-breakdown{display:flex;justify-content:center;gap:2rem;margin-bottom:2rem}
        .rb-item{text-align:center}
        .rb-item .rb-val{font-family:'Space Grotesk',sans-serif;font-size:1.5rem;font-weight:700;color:#fff}
        .rb-item .rb-lbl{font-size:.7rem;color:#4a5a7a;text-transform:uppercase;letter-spacing:1px;margin-top:.15rem}
        .result-grade{display:inline-block;padding:.5rem 2rem;border-radius:12px;font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:2rem;margin-bottom:1.5rem}
        .rg-a{background:rgba(79,140,255,0.15);color:var(--blue);border:1.5px solid rgba(79,140,255,0.3)}
        .rg-b{background:rgba(139,181,255,0.15);color:var(--blue-light);border:1.5px solid rgba(139,181,255,0.3)}
        .rg-c{background:rgba(255,180,50,0.15);color:var(--orange);border:1.5px solid rgba(255,180,50,0.3)}
        .rg-d{background:rgba(255,120,50,0.15);color:#ff7832;border:1.5px solid rgba(255,120,50,0.3)}
        .rg-f{background:rgba(255,70,90,0.15);color:var(--red);border:1.5px solid rgba(255,70,90,0.3)}

        .btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;padding:.85rem 2rem;border-radius:12px;font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:.95rem;text-decoration:none;cursor:pointer;transition:all .3s;position:relative;overflow:hidden;border:none;outline:none}
        .btn-primary{background:linear-gradient(135deg,var(--blue),#3a6fd8);color:#fff;box-shadow:0 4px 20px rgba(79,140,255,0.25)}
        .btn-primary:hover{transform:translateY(-2px);box-shadow:0 8px 30px rgba(79,140,255,0.4)}
        .btn-ghost{background:transparent;color:var(--blue);border:1.5px solid var(--border-hover)}
        .btn-ghost:hover{background:rgba(79,140,255,0.06)}
        .btn .spinner{width:18px;height:18px;border:2px solid transparent;border-top-color:currentColor;border-radius:50%;animation:sp .6s linear infinite}
        @keyframes sp{to{transform:rotate(360deg)}}
        .btn.loading .btn-text{opacity:0}.btn-loader{display:none;position:absolute}.btn.loading .btn-loader{display:flex}
        .ripple{position:absolute;border-radius:50%;background:rgba(255,255,255,0.2);transform:scale(0);animation:ra .6s ease-out forwards;pointer-events:none}
        @keyframes ra{to{transform:scale(4);opacity:0}}

        #toast-container{position:fixed;top:85px;right:1.5rem;z-index:200;display:flex;flex-direction:column;gap:.75rem;pointer-events:none}
        .toast{pointer-events:auto;padding:1rem 1.5rem;border-radius:12px;backdrop-filter:blur(20px);min-width:280px;display:flex;align-items:center;gap:.75rem;font-size:.9rem;font-weight:500;animation:ti .4s cubic-bezier(.16,1,.3,1);border:1px solid}
        .toast.removing{animation:to .3s ease forwards}
        .toast-success{background:rgba(79,140,255,0.1);border-color:rgba(79,140,255,0.25);color:var(--blue)}
        .toast-error{background:rgba(255,70,90,0.1);border-color:rgba(255,70,90,0.25);color:#ff465a}
        @keyframes ti{from{transform:translateX(120%);opacity:0}to{transform:translateX(0);opacity:1}}
        @keyframes to{to{transform:translateX(120%);opacity:0}}
        #confetti{position:fixed;inset:0;z-index:150;pointer-events:none}
        .hidden{display:none!important}
        ::-webkit-scrollbar{width:6px}::-webkit-scrollbar-track{background:var(--dark)}::-webkit-scrollbar-thumb{background:rgba(79,140,255,0.2);border-radius:3px}
        @media(max-width:768px){.btn{width:100%}#navbar{padding:0 1rem}.nav-right{gap:.5rem}.timer-box{padding:.4rem .8rem}.timer-box span{font-size:.9rem;min-width:55px}.progress-bar{display:none}.q-card{padding:1.5rem}.result-breakdown{gap:1rem}}
        @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}#confetti{display:none}}
    </style>
</head>
<body>
    {% csrf_token %}
    <div id="loader">
        <div class="loader-morph"></div>
        <div class="loader-text">Loading</div>
    </div>
    <div class="grid-bg"></div>
    <canvas id="confetti"></canvas>

    <nav id="navbar">
        <a href="/exams/" class="nav-logo">First Goshen Gate</a>
        <div class="nav-right">
            <div class="progress-bar"><div class="progress-fill" id="progress-fill" style="width:0%"></div></div>
            <div class="timer-box" id="timer-box"><i class="fas fa-clock"></i><span id="timer-display">00:00</span></div>
        </div>
    </nav>

    <!-- STUDENT INFO MODAL -->
    <div class="modal-overlay" id="student-modal">
        <div class="modal-card glass">
            <h2><i class="fas fa-user-graduate" style="color:var(--blue);margin-right:.4rem;"></i>Before You Begin</h2>
            <p>Enter your details to start the examination</p>
            <form id="student-info-form">
                <div class="form-group"><input type="text" id="si-name" required placeholder=" "><label>Your Full Name</label></div>
                <div class="form-group"><input type="text" id="si-exam" placeholder=" "><label>Exam Number (optional)</label></div>
                <button type="submit" class="btn btn-primary w-full"><span class="btn-text"><i class="fas fa-play"></i>&nbsp; Start Exam</span></button>
            </form>
        </div>
    </div>

    <div id="exam-wrap" class="hidden">
        <div class="exam-header">
            <div class="exam-subject" id="exam-subject">—</div>
            <div class="exam-info"><span id="exam-class">—</span> &middot; <span id="exam-term">—</span> &middot; <span id="exam-year">—</span></div>
        </div>
        <div class="q-dots" id="q-dots"></div>
        <div id="questions-container"></div>
        <div class="q-nav">
            <button class="btn btn-ghost" id="prev-btn" disabled><i class="fas fa-arrow-left"></i>&nbsp; Previous</button>
            <button class="btn btn-primary" id="next-btn">Next&nbsp; <i class="fas fa-arrow-right"></i></button>
            <button class="btn btn-primary hidden" id="submit-btn"><span class="btn-text"><i class="fas fa-paper-plane"></i>&nbsp; Submit Exam</span><span class="btn-loader"><div class="spinner"></div></span></button>
        </div>
    </div>

    <div id="result-container" class="hidden" style="position:relative;z-index:2;padding:100px 1.5rem 3rem;max-width:600px;margin:0 auto;"></div>

    <div id="toast-container"></div>
    
    <script>
    // Wait for DOM to be fully loaded
    document.addEventListener('DOMContentLoaded', function() {
        console.log('Take exam script initializing...');
        
        // ============================================
        // HIDE LOADER - Robust version with error handling
        // ============================================
        var loader = document.getElementById('loader');
        
        function hideLoader() {
            if (loader) {
                loader.classList.add('done');
                console.log('Loader hidden');
            }
        }
        
        // Hide after 400ms regardless of load state
        setTimeout(hideLoader, 400);
        
        // Also hide when window fully loads
        window.addEventListener('load', function() {
            setTimeout(hideLoader, 100);
        });
        
        // Failsafe: force hide after 3 seconds
        setTimeout(function() {
            if (loader && !loader.classList.contains('done')) {
                loader.style.display = 'none';
                console.warn('Loader force-hidden after timeout');
            }
        }, 3000);

        // ============================================
        // UTILITY FUNCTIONS
        // ============================================
        function getCSRF() {
            var el = document.querySelector('input[name="csrfmiddlewaretoken"]');
            if (el) return el.value;
            var ck = document.cookie.split(';');
            for (var i = 0; i < ck.length; i++) {
                var v = ck[i].trim();
                if (v.indexOf('csrftoken=') === 0) return v.substring(10);
            }
            return '';
        }

        function esc(s) {
            var d = document.createElement('div');
            d.appendChild(document.createTextNode(s || ''));
            return d.innerHTML;
        }

        function setBtnLoading(b, l) {
            if (!b) return;
            if (l) {
                b.classList.add('loading');
                b.disabled = true;
            } else {
                b.classList.remove('loading');
                b.disabled = false;
            }
        }

        function toast(m, t) {
            t = t || 'success';
            var ic = {success: 'fa-check-circle', error: 'fa-times-circle', warning: 'fa-exclamation-triangle'};
            var e = document.createElement('div');
            e.className = 'toast toast-' + t;
            e.innerHTML = '<i class="fas ' + (ic[t] || 'fa-info-circle') + '"></i><span>' + m + '</span>';
            var container = document.getElementById('toast-container');
            if (container) {
                container.appendChild(e);
            }
            setTimeout(function() {
                e.classList.add('removing');
                setTimeout(function() { e.remove(); }, 300);
            }, 4000);
        }

        // ============================================
        // CONFETTI - Safe initialization with null checks
        // ============================================
        var cCV = document.getElementById('confetti');
        var cCX = null;
        var cPs = [];
        var cAn = false;
        
        if (cCV) {
            try {
                cCX = cCV.getContext('2d');
            } catch (err) {
                console.warn('Could not get canvas context:', err);
            }
        }
        
        function resizeCanvas() {
            if (cCV) {
                cCV.width = window.innerWidth;
                cCV.height = window.innerHeight;
            }
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        function launchConfetti() {
            if (!cCX || !cCV) {
                console.warn('Cannot launch confetti: canvas not available');
                return;
            }
            try {
                cPs = [];
                var colors = ['#4f8cff', '#8bb5ff', '#ff465a', '#ffb432', '#c084fc', '#ffffff'];
                for (var i = 0; i < 100; i++) {
                    cPs.push({
                        x: cCV.width / 2 + (Math.random() - 0.5) * 200,
                        y: cCV.height / 2,
                        vx: (Math.random() - 0.5) * 16,
                        vy: -(Math.random() * 12 + 4),
                        w: Math.random() * 10 + 5,
                        h: Math.random() * 6 + 3,
                        rot: Math.random() * 360,
                        rs: (Math.random() - 0.5) * 15,
                        g: 0.25,
                        a: 1,
                        color: colors[Math.floor(Math.random() * colors.length)]
                    });
                }
                if (!cAn) {
                    cAn = true;
                    animateConfetti();
                }
            } catch (err) {
                console.warn('Confetti error:', err);
            }
        }
        
        function animateConfetti() {
            if (!cCX || !cCV) return;
            cCX.clearRect(0, 0, cCV.width, cCV.height);
            cPs = cPs.filter(function(p) { return p.a > 0; });
            for (var i = 0; i < cPs.length; i++) {
                var p = cPs[i];
                p.vy += p.g;
                p.x += p.vx;
                p.y += p.vy;
                p.rot += p.rs;
                p.vx *= 0.99;
                if (p.y > cCV.height) p.a -= 0.05;
                if (p.a <= 0) continue;
                cCX.save();
                cCX.translate(p.x, p.y);
                cCX.rotate((p.rot * Math.PI) / 180);
                cCX.globalAlpha = Math.max(0, p.a);
                cCX.fillStyle = p.color;
                cCX.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
                cCX.restore();
            }
            if (cPs.length > 0) {
                requestAnimationFrame(animateConfetti);
            } else {
                cAn = false;
                cCX.clearRect(0, 0, cCV.width, cCV.height);
            }
        }

        // ============================================
        // RIPPLE EFFECT
        // ============================================
        document.addEventListener('click', function(e) {
            var b = e.target.closest('.btn');
            if (!b) return;
            var r = b.getBoundingClientRect();
            var sz = Math.max(r.width, r.height);
            var rp = document.createElement('span');
            rp.className = 'ripple';
            rp.style.width = rp.style.height = sz + 'px';
            rp.style.left = (e.clientX - r.left - sz / 2) + 'px';
            rp.style.top = (e.clientY - r.top - sz / 2) + 'px';
            b.appendChild(rp);
            setTimeout(function() { if (rp.parentNode) rp.parentNode.removeChild(rp); }, 600);
        });

        // ============================================
        // EXAM STATE
        // ============================================
        var questions = [];
        var currentQ = 0;
        var answers = {};
        var examMeta = {};
        var timeLeft = 0;
        var timerInterval = null;
        var timeStarted = null;
        var examDuration = 30 * 60;

        // ============================================
        // PARSE URL PARAMS - Safe parsing
        // ============================================
        var urlParams;
        try {
            urlParams = new URLSearchParams(window.location.search);
        } catch (err) {
            console.warn('URL parsing error:', err);
            urlParams = new URLSearchParams('');
        }

        var examSubject = urlParams.get('subject') || '';
        var examClass = urlParams.get('class') || '';
        var examTerm = urlParams.get('term') || '';
        var examYear = urlParams.get('year') || '';

        // ============================================
        // LOAD QUESTIONS - Safe fetch with error handling
        // ============================================
        function loadExam() {
            var examId = urlParams.get('exam_id') || '0';

            console.log('Loading exam with params:', {
                student_class: examClass,
                exam_id: parseInt(examId),
                term: examTerm,
                year: examYear
            });

            if (!examClass) {
                toast('Missing class parameter', 'error');
                setTimeout(function() { window.location.href = '/exams/'; }, 2000);
                return;
            }

            fetch('/ajax/get-exam-questions/', {
                method: 'POST',
                headers: { 'X-CSRFToken': getCSRF(), 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    student_class: examClass,
                    exam_id: parseInt(examId),
                    term: examTerm,
                    year: examYear
                })
            })
            .then(function(r) {
                console.log('Response status:', r.status);
                if (!r.ok) throw new Error('HTTP ' + r.status);
                return r.json();
            })
            .then(function(d) {
                console.log('Response data:', d);
                setBtnLoading(document.getElementById('submit-btn'), false);
                
                if (d.status === 'success' && d.questions && d.questions.length > 0) {
                    questions = d.questions;
                    examMeta = d;
                    document.getElementById('exam-subject').textContent = d.subject || examSubject;
                    document.getElementById('exam-class').textContent = d.student_class || examClass;
                    document.getElementById('exam-term').textContent = d.term || examTerm;
                    document.getElementById('exam-year').textContent = d.year || examYear;
                    buildDots();
                    renderQuestion(0);
                    toast('Exam loaded successfully!', 'success');
                } else {
                    console.error('Invalid response:', d);
                    toast(d.message || 'No questions found for this exam', 'error');
                    setTimeout(function() { window.location.href = '/exams/'; }, 2000);
                }
            })
            .catch(function(err) {
                console.error('Fetch error:', err);
                setBtnLoading(document.getElementById('submit-btn'), false);
                toast('Error loading exam: ' + err.message, 'error');
                setTimeout(function() { window.location.href = '/exams/'; }, 2000);
            });
        }

        // ============================================
        // BUILD DOTS
        // ============================================
        function buildDots() {
            var h = '';
            for (var i = 0; i < questions.length; i++) {
                h += '<div class="q-dot" data-idx="' + i + '" onclick="goToQ(' + i + ')">' + (i + 1) + '</div>';
            }
            document.getElementById('q-dots').innerHTML = h;
        }

        // ============================================
        // UPDATE DOTS
        // ============================================
        function updateDots() {
            var dots = document.querySelectorAll('.q-dot');
            for (var i = 0; i < dots.length; i++) {
                dots[i].classList.remove('active', 'answered', 'dot-correct', 'dot-wrong');
                if (i === currentQ) dots[i].classList.add('active');
                else if (answers[i] !== undefined) dots[i].classList.add('answered');
            }
        }

        // ============================================
        // UPDATE PROGRESS
        // ============================================
        function updateProgress() {
            var answered = Object.keys(answers).length;
            var pct = questions.length > 0 ? Math.round((answered / questions.length) * 100) : 0;
            document.getElementById('progress-fill').style.width = pct + '%';
        }

        // ============================================
        // RENDER QUESTION - Safe rendering
        // ============================================
        function renderQuestion(idx) {
            currentQ = idx;
            var q = questions[idx];
            
            if (!q) {
                console.error('Question not found at index:', idx);
                return;
            }
            
            var h = '<div class="q-card glass" style="animation-delay:0s">';
            h += '<div class="q-num">Question ' + (idx + 1) + ' of ' + questions.length + ' &middot; ' + (q.marks || 1) + ' mark' + ((q.marks || 1) > 1 ? 's' : '') + '</div>';
            h += '<div class="q-text">' + esc(q.question_text) + '</div>';

            if (q.question_type === 'multiple_choice') {
                h += '<div class="q-options">';
                var opts = [
                    { l: 'A', v: q.option_a },
                    { l: 'B', v: q.option_b },
                    { l: 'C', v: q.option_c },
                    { l: 'D', v: q.option_d }
                ];
                for (var i = 0; i < opts.length; i++) {
                    if (!opts[i].v) continue;
                    var sel = answers[idx] === opts[i].l ? ' selected' : '';
                    h += '<div class="q-opt' + sel + '" data-q="' + idx + '" data-val="' + opts[i].l + '" onclick="selectOpt(this,' + idx + ',\'' + opts[i].l + '\')"><div class="q-opt-letter">' + opts[i].l + '</div><div class="q-opt-text">' + esc(opts[i].v) + '</div><div class="q-opt-icon"><i class="fas fa-check"></i></div></div></div>';
                }
                h += '</div>';
            } else if (q.question_type === 'true_false') {
                h += '<div class="q-options">';
                var tf = [{ l: 'True', v: 'True' }, { l: 'False', v: 'False' }];
                for (var i = 0; i < tf.length; i++) {
                    var sel = answers[idx] === tf[i].l ? ' selected' : '';
                    h += '<div class="q-opt' + sel + '" data-q="' + idx + '" data-val="' + tf[i].l + '" onclick="selectOpt(this,' + idx + ',\'' + tf[i].l + '\')"><div class="q-opt-letter"><i class="fas fa-' + (i === 0 ? 'check' : 'times') + '"></i></div><div class="q-opt-text">' + tf[i].l + '</div><div class="q-opt-icon"><i class="fas fa-check"></i></div></div></div>';
                }
                h += '</div>';
            } else {
                var val = answers[idx] || '';
                h += '<input type="text" class="q-fill-input" placeholder="Type your answer here..." value="' + esc(val) + '" oninput="fillAnswer(' + idx + ',this.value)">';
            }
            h += '</div>';
            document.getElementById('questions-container').innerHTML = h;
            
            // Update navigation buttons
            var prevBtn = document.getElementById('prev-btn');
            var nextBtn = document.getElementById('next-btn');
            var submitBtn = document.getElementById('submit-btn');
            
            if (prevBtn) prevBtn.disabled = idx === 0;
            if (nextBtn && submitBtn) {
                if (idx === questions.length - 1) {
                    nextBtn.classList.add('hidden');
                    submitBtn.classList.remove('hidden');
                } else {
                    nextBtn.classList.remove('hidden');
                    submitBtn.classList.add('hidden');
                }
            }
            
            updateDots();
            updateProgress();
        }

        // ============================================
        // SELECT OPTION
        // ============================================
        window.selectOpt = function(el, qIdx, val) {
            if (answers[qIdx] !== undefined) return;
            answers[qIdx] = val;
            el.classList.add('selected');
            updateDots();
            updateProgress();
        };

        // ============================================
        // FILL ANSWER
        // ============================================
        window.fillAnswer = function(qIdx, val) {
            if (val.trim()) {
                answers[qIdx] = val.trim();
            } else {
                delete answers[qIdx];
            }
            updateDots();
            updateProgress();
        };

        // ============================================
        // GO TO QUESTION
        // ============================================
        window.goToQ = function(idx) {
            renderQuestion(idx);
        };

        // ============================================
        // PREVIOUS / NEXT BUTTONS
        // ============================================
        var prevBtn = document.getElementById('prev-btn');
        var nextBtn = document.getElementById('next-btn');
        
        if (prevBtn) {
            prevBtn.addEventListener('click', function() {
                if (currentQ > 0) renderQuestion(currentQ - 1);
            });
        }
        
        if (nextBtn) {
            nextBtn.addEventListener('click', function() {
                if (currentQ < questions.length - 1) renderQuestion(currentQ + 1);
            });
        }

        // ============================================
        // TIMER
        // ============================================
        function startTimer() {
            timeStarted = new Date().toISOString();
            timeLeft = examDuration;
            updateTimerDisplay();
            timerInterval = setInterval(function() {
                timeLeft--;
                updateTimerDisplay();
                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    submitExam();
                }
            }, 1000);
        }

        function updateTimerDisplay() {
            var m = Math.floor(timeLeft / 60);
            var s = timeLeft % 60;
            var display = (m < 10 ? '0' : '') + m + ':' + (s < 10 ? '0' : '') + s;
            var displayEl = document.getElementById('timer-display');
            if (displayEl) displayEl.textContent = display;
            
            var box = document.getElementById('timer-box');
            if (box) {
                box.classList.remove('warning', 'danger');
                if (timeLeft <= 60) box.classList.add('danger');
                else if (timeLeft <= 300) box.classList.add('warning');
            }
        }

        // ============================================
        // SUBMIT EXAM
        // ============================================
        var submitBtn = document.getElementById('submit-btn');
        if (submitBtn) {
            submitBtn.addEventListener('click', function() {
                var unanswered = questions.length - Object.keys(answers).length;
                if (unanswered > 0) {
                    if (!confirm(unanswered + ' question' + (unanswered > 1 ? 's' : '') + ' not answered. Submit anyway?')) return;
                }
                submitExam();
            });
        }

        function submitExam() {
            clearInterval(timerInterval);
            setBtnLoading(submitBtn, true);

            fetch('/ajax/submit-exam/', {
                method: 'POST',
                headers: { 'X-CSRFToken': getCSRF(), 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    student_name: document.getElementById('si-name').value.trim(),
                    exam_number: document.getElementById('si-exam').value.trim(),
                    subject: examMeta.subject || examSubject,
                    student_class: examMeta.student_class || examClass,
                    term: examMeta.term || examTerm,
                    year: examMeta.year || examYear,
                    answers: answers,
                    time_started: timeStarted
                })
            })
            .then(function(r) { return r.json(); })
            .then(function(d) {
                setBtnLoading(submitBtn, false);
                if (d.status === 'success') {
                    showResult(d);
                } else {
                    toast(d.message || 'Error submitting exam', 'error');
                }
            })
            .catch(function(err) {
                setBtnLoading(submitBtn, false);
                toast('Error: ' + err.message, 'error');
            });
        }

        // ============================================
        // SHOW RESULT
        // ============================================
        function showResult(d) {
            var examWrap = document.getElementById('exam-wrap');
            var navbar = document.getElementById('navbar');
            
            if (examWrap) examWrap.classList.add('hidden');
            if (navbar) navbar.style.display = 'none';
            
            var pct = d.percentage || 0;
            var grade = 'F', gClass = 'rg-f', sClass = 'poor';
            
            if (pct >= 90) { grade = 'A+'; gClass = 'rg-a'; sClass = 'excellent'; }
            else if (pct >= 80) { grade = 'A'; gClass = 'rg-a'; sClass = 'excellent'; }
            else if (pct >= 70) { grade = 'B'; gClass = 'rg-b'; sClass = 'good'; }
            else if (pct >= 60) { grade = 'C'; gClass = 'rg-c'; sClass = 'good'; }
            else if (pct >= 50) { grade = 'D'; gClass = 'rg-d'; sClass = 'average'; }
            
            var h = '<div class="result-card glass">';
            h += '<div class="result-score ' + sClass + '">' + pct + '%</div>';
            h += '<div class="result-label">Overall Score</div>';
            h += '<div class="result-breakdown">';
            h += '<div class="rb-item"><div class="rb-val">' + (d.score || 0) + '</div><div class="rb-lbl">Score</div></div>';
            h += '<div class="rb-item"><div class="rb-val">' + (d.total_marks || 0) + '</div><div class="rb-lbl">Total</div></div>';
            h += '<div class="rb-item"><div class="rb-val">' + Object.keys(answers).length + '</div><div class="rb-lbl">Answered</div></div>';
            h += '</div>';
            h += '<div class="result-grade ' + gClass + '">' + grade + '</div><br>';
            h += '<a href="/exams/" class="btn btn-primary"><span class="btn-text"><i class="fas fa-arrow-left"></i>&nbsp; Back to Exams</span></a>';
            h += '</div>';
            
            var resultContainer = document.getElementById('result-container');
            if (resultContainer) {
                resultContainer.innerHTML = h;
                resultContainer.classList.remove('hidden');
            }
            
            if (pct >= 50) {
                launchConfetti();
            }
        }

        console.log('Take exam script initialized successfully');

    }); // End DOMContentLoaded
    </script>
</body>
</html>

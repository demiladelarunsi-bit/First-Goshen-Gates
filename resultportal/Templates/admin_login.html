{% load static %}
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Teacher — First Goshen Gate</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              blue: "#4f8cff",
              "blue-light": "#8bb5ff",
              dark: "#060a14",
            },
            fontFamily: {
              display: ['"Space Grotesk"', "sans-serif"],
              body: ['"DM Sans"', "sans-serif"],
            },
          },
        },
      };
    </script>
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=DM+Sans:wght@300;400;500;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
    <style>
      :root {
        --blue: #4f8cff;
        --blue-light: #8bb5ff;
        --dark: #060a14;
        --card: rgba(10, 16, 30, 0.8);
        --border: rgba(79, 140, 255, 0.12);
        --border-hover: rgba(79, 140, 255, 0.35);
        --glow: 0 0 20px rgba(79, 140, 255, 0.12);
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: "DM Sans", sans-serif;
        background: var(--dark);
        color: #c8cdd8;
        min-height: 100vh;
        overflow-x: hidden;
      }
      #loader {
        position: fixed;
        inset: 0;
        z-index: 9999;
        background: var(--dark);
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        gap: 1.5rem;
        transition:
          opacity 0.5s,
          visibility 0.5s;
      }
      #loader.done {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      .loader-morph {
        width: 50px;
        height: 50px;
        background: linear-gradient(135deg, var(--blue), var(--blue-light));
        animation: morph 1.2s ease-in-out infinite;
      }
      @keyframes morph {
        0% {
          border-radius: 50%;
          transform: rotate(0) scale(1);
        }
        25% {
          border-radius: 30% 70% 70% 30%/30% 30% 70% 70%;
          transform: rotate(90deg) scale(1.1);
        }
        50% {
          border-radius: 50%;
          transform: rotate(180deg);
        }
        75% {
          border-radius: 70% 30% 30% 70%/70% 70% 30% 30%;
          transform: rotate(270deg) scale(1.1);
        }
        100% {
          border-radius: 50%;
          transform: rotate(360deg) scale(1);
        }
      }
      .loader-text {
        font-family: "Space Grotesk", sans-serif;
        font-size: 0.75rem;
        font-weight: 600;
        color: #3a4a6a;
        text-transform: uppercase;
        letter-spacing: 3px;
      }
      #particles {
        position: fixed;
        inset: 0;
        z-index: 0;
        pointer-events: none;
      }
      .grid-bg {
        position: fixed;
        inset: 0;
        z-index: 0;
        pointer-events: none;
        background-image:
          linear-gradient(rgba(79, 140, 255, 0.02) 1px, transparent 1px),
          linear-gradient(90deg, rgba(79, 140, 255, 0.02) 1px, transparent 1px);
        background-size: 70px 70px;
        animation: gp 6s ease-in-out infinite;
      }
      @keyframes gp {
        0%,
        100% {
          opacity: 0.5;
        }
        50% {
          opacity: 1;
        }
      }
      .glass {
        background: var(--card);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border: 1px solid var(--border);
        border-radius: 16px;
        box-shadow: var(--glow);
      }
      #navbar {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        z-index: 100;
        padding: 0 2rem;
        height: 70px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        background: rgba(6, 10, 20, 0.85);
        backdrop-filter: blur(24px);
        border-bottom: 1px solid var(--border);
      }
      .nav-logo {
        font-family: "Space Grotesk", sans-serif;
        font-weight: 700;
        font-size: 1.5rem;
        background: linear-gradient(135deg, var(--blue), var(--blue-light));
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        text-decoration: none;
      }
      .nav-right {
        display: flex;
        align-items: center;
        gap: 0.75rem;
      }
      .nav-right a {
        padding: 0.45rem 1.1rem;
        border-radius: 10px;
        font-size: 0.85rem;
        font-weight: 500;
        color: #6b7a99;
        text-decoration: none;
        transition: all 0.3s;
        border: 1px solid transparent;
      }
      .nav-right a:hover {
        color: var(--blue);
        border-color: var(--border-hover);
        background: rgba(79, 140, 255, 0.05);
      }
      .login-wrap {
        position: relative;
        z-index: 2;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 100px 1.5rem 3rem;
      }
      .login-card {
        width: 100%;
        max-width: 420px;
        padding: 3rem 2.5rem;
        text-align: center;
        position: relative;
        animation: cu 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        opacity: 0;
        transform: translateY(30px);
      }
      @keyframes cu {
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      .login-card::before {
        content: "";
        position: absolute;
        inset: -1px;
        border-radius: 17px;
        background: linear-gradient(
          135deg,
          rgba(79, 140, 255, 0.3),
          transparent 40%,
          transparent 60%,
          rgba(139, 181, 255, 0.2)
        );
        z-index: -1;
        opacity: 0;
        transition: opacity 0.4s;
      }
      .login-card:hover::before {
        opacity: 1;
      }
      .card-icon {
        width: 80px;
        height: 80px;
        border-radius: 50%;
        background: rgba(79, 140, 255, 0.08);
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0 auto 1.5rem;
        border: 1.5px solid var(--border);
      }
      .card-icon i {
        font-size: 1.8rem;
        color: var(--blue);
      }
      .login-card h2 {
        font-family: "Space Grotesk", sans-serif;
        font-size: 1.5rem;
        font-weight: 700;
        color: #fff;
        margin-bottom: 0.25rem;
      }
      .login-card .sub {
        color: #5a6a8a;
        font-size: 0.9rem;
        margin-bottom: 2rem;
      }
      .form-group {
        position: relative;
        margin-bottom: 1.25rem;
        text-align: left;
      }
      .form-group input {
        width: 100%;
        padding: 1rem 1rem 0.75rem;
        background: rgba(255, 255, 255, 0.03);
        border: 1.5px solid var(--border);
        border-radius: 12px;
        color: #e0e4ed;
        font-family: "DM Sans", sans-serif;
        font-size: 0.95rem;
        outline: none;
        transition: all 0.3s;
      }
      .form-group input:focus {
        border-color: var(--blue);
        box-shadow: 0 0 0 3px rgba(79, 140, 255, 0.1);
        background: rgba(79, 140, 255, 0.03);
      }
      .form-group label {
        position: absolute;
        top: 0.85rem;
        left: 1rem;
        color: #4a5a7a;
        font-size: 0.95rem;
        pointer-events: none;
        transition: all 0.25s;
        transform-origin: left;
      }
      .form-group input:focus ~ label,
      .form-group input:not(:placeholder-shown) ~ label {
        top: -0.5rem;
        left: 0.75rem;
        font-size: 0.7rem;
        color: var(--blue);
        background: var(--dark);
        padding: 0 0.35rem;
        font-weight: 600;
        letter-spacing: 0.5px;
      }
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 0.5rem;
        padding: 0.85rem 2rem;
        border-radius: 12px;
        font-family: "Space Grotesk", sans-serif;
        font-weight: 600;
        font-size: 0.95rem;
        text-decoration: none;
        cursor: pointer;
        transition: all 0.3s;
        position: relative;
        overflow: hidden;
        border: none;
        outline: none;
      }
      .btn-primary {
        background: linear-gradient(135deg, var(--blue), #3a6fd8);
        color: #fff;
        box-shadow: 0 4px 20px rgba(79, 140, 255, 0.25);
      }
      .btn-primary:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 30px rgba(79, 140, 255, 0.4);
      }
      .btn .spinner {
        width: 18px;
        height: 18px;
        border: 2px solid transparent;
        border-top-color: currentColor;
        border-radius: 50%;
        animation: sp 0.6s linear infinite;
      }
      @keyframes sp {
        to {
          transform: rotate(360deg);
        }
      }
      .btn.loading .btn-text {
        opacity: 0;
      }
      .btn-loader {
        display: none;
        position: absolute;
      }
      .btn.loading .btn-loader {
        display: flex;
      }
      .w-full {
        width: 100%;
      }
      .ripple {
        position: absolute;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.2);
        transform: scale(0);
        animation: ra 0.6s ease-out forwards;
        pointer-events: none;
      }
      @keyframes ra {
        to {
          transform: scale(4);
          opacity: 0;
        }
      }
      .signup-link {
        text-align: center;
        margin-top: 1.5rem;
        color: #5a6a8a;
        font-size: 0.9rem;
      }
      .signup-link a {
        color: var(--blue);
        text-decoration: none;
        font-weight: 600;
      }
      .signup-link a:hover {
        text-decoration: underline;
      }
      #toast-container {
        position: fixed;
        top: 85px;
        right: 1.5rem;
        z-index: 200;
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
        pointer-events: none;
      }
      .toast {
        pointer-events: auto;
        padding: 1rem 1.5rem;
        border-radius: 12px;
        backdrop-filter: blur(20px);
        min-width: 280px;
        display: flex;
        align-items: center;
        gap: 0.75rem;
        font-size: 0.9rem;
        font-weight: 500;
        animation: ti 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        border: 1px solid;
      }
      .toast.removing {
        animation: to 0.3s ease forwards;
      }
      .toast-success {
        background: rgba(79, 140, 255, 0.1);
        border-color: rgba(79, 140, 255, 0.25);
        color: var(--blue);
      }
      .toast-error {
        background: rgba(255, 70, 90, 0.1);
        border-color: rgba(255, 70, 90, 0.25);
        color: #ff465a;
      }
      @keyframes ti {
        from {
          transform: translateX(120%);
          opacity: 0;
        }
        to {
          transform: translateX(0);
          opacity: 1;
        }
      }
      @keyframes to {
        to {
          transform: translateX(120%);
          opacity: 0;
        }
      }
      .hidden {
        display: none !important;
      }
      ::-webkit-scrollbar {
        width: 6px;
      }
      ::-webkit-scrollbar-track {
        background: var(--dark);
      }
      ::-webkit-scrollbar-thumb {
        background: rgba(79, 140, 255, 0.2);
        border-radius: 3px;
      }
      @media (max-width: 768px) {
        .btn {
          width: 100%;
        }
        #navbar {
          padding: 0 1rem;
        }
        .login-card {
          padding: 2rem 1.5rem;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.01ms !important;
          transition-duration: 0.01ms !important;
        }
        #particles {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    {% csrf_token %}
    <div id="loader">
      <div class="loader-morph"></div>
      <div class="loader-text">Loading</div>
    </div>
    <canvas id="particles"></canvas>
    <div class="grid-bg"></div>
    <nav id="navbar">
      <a href="/" class="nav-logo">First Goshen Gate</a>
      <div class="nav-right">
        <a href="/admin/signup/"
          ><i class="fas fa-user-plus" style="margin-right: 0.35rem"></i>Sign
          Up</a
        >
        <a href="/"
          ><i class="fas fa-home" style="margin-right: 0.35rem"></i>Home</a
        >
      </div>
    </nav>
    <div class="login-wrap">
      <div class="login-card glass" style="position: relative">
        <div class="card-icon"><i class="fas fa-lock"></i></div>
        <h2>Teacher Login</h2>
        <p class="sub">Sign in to manage student results</p>
        <form id="login-form">
          <div class="form-group">
            <input
              type="text"
              id="login-user"
              required
              placeholder=" "
              autocomplete="username"
            /><label>Username</label>
          </div>
          <div class="form-group">
            <input
              type="password"
              id="login-pass"
              required
              placeholder=" "
              autocomplete="current-password"
            /><label>Password</label>
          </div>
          <button
            type="submit"
            class="btn btn-primary w-full"
            style="margin-top: 0.5rem"
          >
            <span class="btn-text"
              ><i class="fas fa-sign-in-alt"></i>&nbsp; Sign In</span
            >
            <span class="btn-loader"><div class="spinner"></div></span>
          </button>
        </form>
        <div class="signup-link">
          Don't have an account? <a href="/admin/signup/">Create one</a>
        </div>
      </div>
    </div>
    <div id="toast-container"></div>
    <script>
      setTimeout(function () {
        document.getElementById("loader").classList.add("done");
      }, 2000);
      window.addEventListener("load", function () {
        setTimeout(function () {
          document.getElementById("loader").classList.add("done");
        }, 400);
      });
      (function () {
        var c = document.getElementById("particles"),
          x = c.getContext("2d"),
          pts = [];
        function r() {
          c.width = innerWidth;
          c.height = innerHeight;
        }
        r();
        addEventListener("resize", r);
        for (var i = 0; i < 40; i++)
          pts.push({
            x: Math.random() * c.width,
            y: Math.random() * c.height,
            vx: (Math.random() - 0.5) * 0.4,
            vy: (Math.random() - 0.5) * 0.4,
            r: Math.random() * 1.5 + 0.5,
            hue: Math.random() > 0.5 ? 220 : 210,
            a: Math.random() * 0.3 + 0.15,
          });
        (function loop() {
          x.clearRect(0, 0, c.width, c.height);
          for (var i = 0; i < pts.length; i++) {
            var p = pts[i];
            p.x += p.vx;
            p.y += p.vy;
            if (p.x < 0) p.x = c.width;
            if (p.x > c.width) p.x = 0;
            if (p.y < 0) p.y = c.height;
            if (p.y > c.height) p.y = 0;
            x.beginPath();
            x.arc(p.x, p.y, Math.max(0.1, p.r), 0, Math.PI * 2);
            x.fillStyle = "hsla(" + p.hue + ",80%,65%," + p.a + ")";
            x.fill();
          }
          for (var i = 0; i < pts.length; i++)
            for (var j = i + 1; j < pts.length; j++) {
              var dx = pts[i].x - pts[j].x,
                dy = pts[i].y - pts[j].y,
                d = Math.sqrt(dx * dx + dy * dy);
              if (d < 120) {
                x.beginPath();
                x.moveTo(pts[i].x, pts[i].y);
                x.lineTo(pts[j].x, pts[j].y);
                x.strokeStyle = "rgba(79,140,255," + (1 - d / 120) * 0.08 + ")";
                x.lineWidth = 0.5;
                x.stroke();
              }
            }
          requestAnimationFrame(loop);
        })();
      })();
      function getCSRF() {
        var el = document.querySelector('input[name="csrfmiddlewaretoken"]');
        if (el) return el.value;
        var ck = document.cookie.split(";");
        for (var i = 0; i < ck.length; i++) {
          var v = ck[i].trim();
          if (v.indexOf("csrftoken=") === 0) return v.substring(10);
        }
        return "";
      }
      function setBtnLoading(b, l) {
        if (l) {
          b.classList.add("loading");
          b.disabled = true;
        } else {
          b.classList.remove("loading");
          b.disabled = false;
        }
      }
      function toast(m, t) {
        t = t || "success";
        var ic = { success: "fa-check-circle", error: "fa-times-circle" },
          e = document.createElement("div");
        e.className = "toast toast-" + t;
        e.innerHTML =
          '<i class="fas ' +
          (ic[t] || "fa-info-circle") +
          '"></i><span>' +
          m +
          "</span>";
        document.getElementById("toast-container").appendChild(e);
        setTimeout(function () {
          e.classList.add("removing");
          setTimeout(function () {
            e.remove();
          }, 300);
        }, 3500);
      }
      document.addEventListener("click", function (e) {
        var b = e.target.closest(".btn");
        if (!b) return;
        var r = b.getBoundingClientRect(),
          sz = Math.max(r.width, r.height),
          rp = document.createElement("span");
        rp.className = "ripple";
        rp.style.width = rp.style.height = sz + "px";
        rp.style.left = e.clientX - r.left - sz / 2 + "px";
        rp.style.top = e.clientY - r.top - sz / 2 + "px";
        b.appendChild(rp);
        setTimeout(function () {
          rp.remove();
        }, 600);
      });
      document
        .getElementById("login-form")
        .addEventListener("submit", function (e) {
          e.preventDefault();
          var btn = this.querySelector(".btn");
          setBtnLoading(btn, true);
          var fd = new FormData();
          fd.append(
            "username",
            document.getElementById("login-user").value.trim(),
          );
          fd.append("password", document.getElementById("login-pass").value);
          fetch("/ajax/admin/login/", {
            method: "POST",
            headers: { "X-CSRFToken": getCSRF() },
            body: fd,
          })
            .then(function (r) {
              return r.json();
            })
            .then(function (d) {
              setBtnLoading(btn, false);
              if (d.status === "success") {
                toast("Welcome back, " + d.username + "!", "success");
                setTimeout(function () {
                  window.location.href = "/admin/dashboard/";
                }, 800);
              } else {
                toast(d.message || "Invalid credentials", "error");
              }
            })
            .catch(function () {
              setBtnLoading(btn, false);
              toast("Network error", "error");
            });
        });
    </script>
  </body>
</html>

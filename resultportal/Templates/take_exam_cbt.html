{% load static %}<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>{{subject}} - CBT Exam</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config={theme:{extend:{colors:{blue:'#4f8cff','blue-light':'#8bb5ff',dark:'#060a14',green:'#22c55e',red:'#ef4444'},fontFamily:{display:['"Space Grotesk"','sans-serif'],body:['"DM Sans"','sans-serif']}}}}</script>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=DM+Sans:wght@300;400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
:root{--blue:#4f8cff;--blue-light:#8bb5ff;--dark:#060a14;--card:rgba(10,16,30,0.8);--border:rgba(79,140,255,0.12);--border-hover:rgba(79,140,255,0.35);--glow:0 0 20px rgba(79,140,255,0.12);--green:#22c55e;--red:#ef4444}
*{box-sizing:border-box;margin:0;padding:0}body{font-family:'DM Sans',sans-serif;background:var(--dark);color:#c8cdd8;min-height:100vh;overflow-x:hidden}
.glass{background:var(--card);backdrop-filter:blur(20px);border:1px solid var(--border);border-radius:16px;box-shadow:var(--glow)}
#navbar{position:fixed;top:0;left:0;right:0;z-index:100;padding:0 2rem;height:70px;display:flex;align-items:center;justify-content:space-between;background:rgba(6,10,20,0.85);backdrop-filter:blur(24px);border-bottom:1px solid var(--border)}
.nav-logo{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:1.5rem;background:linear-gradient(135deg,var(--blue),var(--blue-light));-webkit-background-clip:text;-webkit-text-fill-color:transparent;text-decoration:none}
#exam-wrap{position:relative;z-index:2;padding:85px 1.5rem 3rem;max-width:800px;margin:0 auto}
.exam-header{text-align:center;margin-bottom:1rem;padding:1.5rem 2rem;background:linear-gradient(180deg,rgba(79,140,255,0.06) 0%,transparent 100%);border-radius:16px;border:1px solid var(--border)}
.exam-header h1{font-family:'Space Grotesk',sans-serif;font-size:1.4rem;font-weight:700;color:#fff;margin-bottom:.35rem}
.exam-header .eh-sub{color:#5a6a8a;font-size:.85rem}
.top-bar{display:flex;align-items:center;justify-content:space-between;padding:.75rem 1.25rem;margin-bottom:1rem;border-radius:12px;background:rgba(6,10,20,0.95);backdrop-filter:blur(20px);border:1px solid var(--border);position:sticky;top:70px;z-index:50}
.timer-display{font-family:'Space Grotesk',sans-serif;font-size:1.2rem;font-weight:700;color:#fff;display:flex;align-items:center;gap:.5rem}
.timer-display i{color:var(--blue)}
.timer-display.warning{color:#ffb432}.timer-display.danger{color:#ff465a;animation:pulse 1s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
.progress-text{font-size:.85rem;color:#5a6a8a}.progress-text strong{color:var(--blue-light)}

/* Question Area */
.q-area{min-height:380px;display:flex;flex-direction:column;justify-content:space-between}
.q-card{padding:2rem;animation:fadeUp .4s ease forwards}
@keyframes fadeUp{from{opacity:0;transform:translateY(15px)}to{opacity:1;transform:translateY(0)}}
.q-num{font-family:'Space Grotesk',sans-serif;font-size:.7rem;font-weight:700;color:var(--blue);text-transform:uppercase;letter-spacing:1.5px;margin-bottom:1rem;display:flex;align-items:center;gap:.5rem}
.q-num::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,var(--border),transparent)}
.q-text{font-size:1.1rem;color:#e0e4ed;line-height:1.8;margin-bottom:1.5rem;font-weight:500}
.options{display:flex;flex-direction:column;gap:.6rem}
.opt-label{display:flex;align-items:center;gap:.75rem;padding:.9rem 1.1rem;border-radius:12px;border:1.5px solid var(--border);cursor:pointer;transition:all .25s}
.opt-label:hover{border-color:var(--border-hover);background:rgba(79,140,255,0.03)}
.opt-label input{display:none}
.opt-radio{width:24px;height:24px;border-radius:50%;border:2px solid #3a4a6a;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .25s}
.opt-label input:checked ~ .opt-radio{border-color:var(--blue);background:var(--blue)}
.opt-label input:checked ~ .opt-radio::after{content:'';width:10px;height:10px;border-radius:50%;background:#fff}
.opt-label input:checked ~ .opt-text{color:#fff}
.opt-text{font-size:.95rem;color:#9aa5b8;transition:color .25s}
.opt-letter{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:.85rem;color:#4a5a7a;min-width:22px}

/* Navigation */
.q-nav{display:flex;justify-content:space-between;align-items:center;margin-top:2rem;gap:1rem}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;padding:.8rem 1.8rem;border-radius:12px;font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:.9rem;cursor:pointer;transition:all .3s;border:none;outline:none;text-decoration:none}
.btn-primary{background:linear-gradient(135deg,var(--blue),#3a6fd8);color:#fff;box-shadow:0 4px 20px rgba(79,140,255,0.25)}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 8px 30px rgba(79,140,255,0.4)}
.btn-ghost{background:transparent;border:1.5px solid var(--border);color:#6b7a99}
.btn-ghost:hover{border-color:var(--border-hover);color:var(--blue)}
.btn-danger{background:linear-gradient(135deg,#ef4444,#dc2626);color:#fff}
.btn-danger:hover{transform:translateY(-2px);box-shadow:0 8px 30px rgba(239,68,68,0.4)}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none!important;box-shadow:none!important}

/* Question Grid */
.q-grid{display:flex;flex-wrap:wrap;gap:.4rem;margin-top:1.5rem;justify-content:center}
.q-grid-btn{width:36px;height:36px;border-radius:8px;border:1.5px solid var(--border);background:transparent;color:#5a6a8a;font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:.8rem;cursor:pointer;transition:all .2s;display:flex;align-items:center;justify-content:center}
.q-grid-btn.answered{background:rgba(79,140,255,0.15);border-color:rgba(79,140,255,0.4);color:var(--blue)}
.q-grid-btn.current{background:var(--blue);border-color:var(--blue);color:#fff}
.q-grid-btn:hover{border-color:var(--border-hover)}

/* Correction Page */
.correction-header{text-align:center;padding:2rem;margin-bottom:1.5rem}
.correction-header h2{font-family:'Space Grotesk',sans-serif;font-size:1.6rem;font-weight:700;color:#fff;margin-bottom:.5rem}
.score-circle{width:120px;height:120px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;margin:1rem auto;border:3px solid}
.score-circle.pass{border-color:var(--green);background:rgba(34,197,94,0.08)}
.score-circle.fail{border-color:var(--red);background:rgba(239,68,68,0.08)}
.score-circle .sc-val{font-family:'Space Grotesk',sans-serif;font-size:2rem;font-weight:700;color:#fff}
.score-circle .sc-lab{font-size:.7rem;color:#5a6a8a;text-transform:uppercase;letter-spacing:1px}
.corr-stats{display:flex;justify-content:center;gap:2rem;margin:1rem 0}
.corr-stat{text-align:center}
.corr-stat .cs-val{font-family:'Space Grotesk',sans-serif;font-size:1.3rem;font-weight:700;color:#fff}
.corr-stat .cs-lab{font-size:.7rem;color:#4a5a7a;text-transform:uppercase;letter-spacing:1px}
.corr-q{padding:1.5rem;margin-bottom:1rem;border-left:3px solid var(--border)}
.corr-q.correct{border-left-color:var(--green);background:rgba(34,197,94,0.03)}
.corr-q.wrong{border-left-color:var(--red);background:rgba(239,68,68,0.03)}
.corr-badge{display:inline-block;padding:.15rem .6rem;border-radius:6px;font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.5px;margin-bottom:.75rem}
.corr-badge.correct{background:rgba(34,197,94,0.15);color:var(--green)}
.corr-badge.wrong{background:rgba(239,68,68,0.15);color:var(--red)}
.corr-answer{font-size:.85rem;margin-top:.5rem;padding:.5rem .75rem;border-radius:8px;background:rgba(255,255,255,0.02)}
.corr-answer.your-wrong{color:var(--red);text-decoration:line-through;opacity:.7}
.corr-answer.correct-ans{color:var(--green);border:1px solid rgba(34,197,94,0.2)}
.hidden{display:none!important}
#toast-container{position:fixed;top:85px;right:1.5rem;z-index:300;display:flex;flex-direction:column;gap:.75rem}
.toast{padding:1rem 1.5rem;border-radius:12px;backdrop-filter:blur(20px);min-width:280px;display:flex;align-items:center;gap:.75rem;font-size:.9rem;font-weight:500;animation:slideIn .4s ease;border:1px solid}
.toast.removing{animation:slideOut .3s ease forwards}
.toast-success{background:rgba(79,140,255,0.1);border-color:rgba(79,140,255,0.25);color:var(--blue)}
.toast-error{background:rgba(255,70,90,0.1);border-color:rgba(255,70,90,0.25);color:#ff465a}
@keyframes slideIn{from{transform:translateX(120%);opacity:0}to{transform:translateX(0);opacity:1}}
@keyframes slideOut{to{transform:translateX(120%);opacity:0}}
@media(max-width:768px){#navbar{padding:0 1rem}#exam-wrap{padding:80px 1rem 2rem}.exam-header{padding:1.25rem}.exam-header h1{font-size:1.2rem}.q-card{padding:1.25rem}.q-nav{flex-direction:column}.q-nav .btn{width:100%}.q-grid-btn{width:32px;height:32px;font-size:.75rem}.corr-stats{gap:1rem}}
@media (max-width: 768px) {
    #exam-wrap {
        padding: 80px 1rem 2rem !important;
    }
    .q-card {
        padding: 1.25rem !important;
    }
    .q-text {
        font-size: 1rem !important;
    }
    .opt-label {
        padding: 0.75rem 0.9rem !important;
    }
    .q-nav {
        flex-direction: column !important;
    }
    .q-nav .btn {
        width: 100% !important;
    }
    .q-grid {
        order: -1;
        margin-bottom: 1rem;
    }
    .q-grid-btn {
        width: 32px !important;
        height: 32px !important;
        font-size: 0.75rem !important;
    }
    .top-bar {
        flex-direction: column;
        gap: 0.5rem;
        text-align: center;
    }
    .exam-header {
        padding: 1.25rem !important;
    }
    .exam-header h1 {
        font-size: 1.2rem !important;
    }
    .correction-header h2 {
        font-size: 1.3rem !important;
    }
    .score-circle {
        width: 100px !important;
        height: 100px !important;
    }
    .score-circle .sc-val {
        font-size: 1.5rem !important;
    }
    .corr-stats {
        gap: 1rem !important;
    }
}
</style>
</head>
<body>
{% csrf_token %}
<nav id="navbar"><a href="/" class="nav-logo">First Goshen Gate</a></nav>
<div id="exam-wrap">
<div class="exam-header glass">
<h1><i class="fas fa-book" style="color:var(--blue);margin-right:.4rem;"></i>{{subject}}</h1>
<p class="eh-sub">{{student_name}} &middot; {{student_class}} &middot; {{term}} {{year}}</p>
</div>

<!-- EXAM MODE -->
<div id="exam-mode">
<div class="top-bar glass">
<div class="timer-display" id="timer"><i class="fas fa-clock"></i><span id="timer-text">30:00</span></div>
<div class="progress-text"><strong id="answered-count">0</strong> / {{questions|length}} answered</div>
</div>
<div class="q-area glass" id="q-area"></div>
<div class="q-nav" id="q-nav">
<button class="btn btn-ghost" id="prev-btn" onclick="changeQ(-1)"><i class="fas fa-arrow-left"></i> Previous</button>
<div class="q-grid" id="q-grid"></div>
<button class="btn btn-primary" id="next-btn" onclick="changeQ(1)">Next <i class="fas fa-arrow-right"></i></button>
</div>
<div style="text-align:center;margin-top:1.5rem;">
<button class="btn btn-danger" onclick="finishExam()" style="padding:.7rem 2rem;"><i class="fas fa-paper-plane"></i> Submit Exam</button>
</div>
</div>

<!-- CORRECTION MODE (hidden initially) -->
<div id="correction-mode" class="hidden"></div>
</div>
<div id="toast-container"></div>

<script>
// Questions data injected by Django
var QUESTIONS = {{questions_json|safe}};
var TOTAL = QUESTIONS.length;
var TOTAL_MARKS = {{total_marks}};
var EXAM_ID = '{{exam_id}}';
var SUBJECT = '{{subject|escapejs}}';
var STUDENT_NAME = '{{student_name|escapejs}}';
var EXAM_NUMBER = '{{exam_number|escapejs}}';
var STUDENT_CLASS = '{{student_class|escapejs}}';
var TERM = '{{term|escapejs}}';
var YEAR = '{{year|escapejs}}';

var currentQ = 0;
var answers = {};
var timeLeft = 30 * 60;
var timerInterval = null;
var submitted = false;

// Initialize
buildGrid();
showQuestion(0);
startTimer();

function getCSRF() {
    var el = document.querySelector('input[name="csrfmiddlewaretoken"]');
    if (el) return el.value;
    var ck = document.cookie.split(';');
    for (var i = 0; i < ck.length; i++) {
        var c = ck[i].trim();
        if (c.indexOf('csrftoken=') === 0) return c.substring(10);
    }
    return '';
}

function buildGrid() {
    var grid = document.getElementById('q-grid');
    var html = '';
    for (var i = 0; i < TOTAL; i++) {
        html += '<button class="q-grid-btn" data-idx="' + i + '" onclick="jumpTo(' + i + ')">' + (i + 1) + '</button>';
    }
    grid.innerHTML = html;
}

function updateGrid() {
    var btns = document.querySelectorAll('.q-grid-btn');
    for (var i = 0; i < btns.length; i++) {
        var idx = parseInt(btns[i].getAttribute('data-idx'));
        btns[i].classList.remove('answered', 'current');
        if (answers[idx]) btns[i].classList.add('answered');
        if (idx === currentQ) btns[i].classList.add('current');
    }
    var count = Object.keys(answers).length;
    document.getElementById('answered-count').textContent = count;
}

function showQuestion(idx) {
    if (idx < 0 || idx >= TOTAL) return;
    currentQ = idx;
    var q = QUESTIONS[idx];
    var selected = answers[idx] || '';

    var html = '<div class="q-card">';
    html += '<div class="q-num">Question ' + (idx + 1) + ' of ' + TOTAL + ' <span style="margin-left:auto;font-size:.75rem;color:#4a5a7a;">' + q.marks + ' mark' + (q.marks > 1 ? 's' : '') + '</span></div>';
    html += '<div class="q-text">' + q.question_text + '</div>';
    html += '<div class="options">';

    var letters = ['A', 'B', 'C', 'D'];
    var opts = [q.option_a, q.option_b, q.option_c, q.option_d];
    for (var i = 0; i < 4; i++) {
        var checked = (selected === letters[i]) ? 'checked' : '';
        html += '<label class="opt-label">';
        html += '<input type="radio" name="q_opt" value="' + letters[i] + '" ' + checked + ' onchange="selectOpt(this.value)">';
        html += '<span class="opt-radio"></span>';
        html += '<span class="opt-letter">' + letters[i] + '</span>';
        html += '<span class="opt-text">' + opts[i] + '</span>';
        html += '</label>';
    }
    html += '</div></div>';

    document.getElementById('q-area').innerHTML = html;
    document.getElementById('prev-btn').disabled = (idx === 0);
    
    var nextBtn = document.getElementById('next-btn');
    if (idx === TOTAL - 1) {
        nextBtn.innerHTML = '<i class="fas fa-check"></i> Finish';
        nextBtn.onclick = function() { finishExam(); };
    } else {
        nextBtn.innerHTML = 'Next <i class="fas fa-arrow-right"></i>';
        nextBtn.onclick = function() { changeQ(1); };
    }
    updateGrid();
}

function selectOpt(val) {
    answers[QUESTIONS[currentQ].id] = val;
    updateGrid();
}

function changeQ(dir) {
    showQuestion(currentQ + dir);
}

function jumpTo(idx) {
    showQuestion(idx);
}
    fetch('/ajax/submit-exam/', {
        method: 'POST',
        headers: { 'X-CSRFToken': getCSRF(), 'Content-Type': 'application/json' },
        body: JSON.stringify({
            answers: answers, student_name: STUDENT_NAME, exam_number: EXAM_NUMBER,
            student_class: STUDENT_CLASS, subject: SUBJECT, term: TERM, year: YEAR, exam_id: EXAM_ID,
            question_ids: QUESTIONS.map(function(q){return String(q.id);})
        })
    })

function startTimer() {
    timerInterval = setInterval(function () {
        if (submitted) return clearInterval(timerInterval);
        timeLeft--;
        if (timeLeft <= 0) { clearInterval(timerInterval); toast('Time is up!', 'error'); finishExam(); return; }
        var m = Math.floor(timeLeft / 60);
        var s = timeLeft % 60;
        var txt = (m < 10 ? '0' : '') + m + ':' + (s < 10 ? '0' : '') + s;
        var el = document.getElementById('timer-text');
        var wrap = document.getElementById('timer');
        el.textContent = txt;
        wrap.classList.remove('warning', 'danger');
        if (timeLeft <= 60) wrap.classList.add('danger');
        else if (timeLeft <= 300) wrap.classList.add('warning');
    }, 1000);
}

function finishExam() {
    var count = Object.keys(answers).length;
    if (count < TOTAL) {
        if (!confirm('You have answered ' + count + ' out of ' + TOTAL + ' questions.\nSubmit anyway?')) return;
    }
    if (submitted) return;
    submitted = true;
    clearInterval(timerInterval);

    toast('Submitting exam...', 'success');

    // Prepare question IDs from QUESTIONS array
    var questionIds = QUESTIONS.map(function(q) { return String(q.id); });

    fetch('/ajax/submit-exam/', {
        method: 'POST',
        headers: { 'X-CSRFToken': getCSRF(), 'Content-Type': 'application/json' },
        body: JSON.stringify({
            answers: answers,
            student_name: STUDENT_NAME,
            exam_number: EXAM_NUMBER,
            student_class: STUDENT_CLASS,
            subject: SUBJECT,
            term: TERM,
            year: YEAR,
            exam_id: EXAM_ID,
            question_ids: questionIds
        })
    })
    .then(function(r) { return r.json(); })
    .then(function(d) {
        if (d.status === 'success') {
            showCorrection(d.score, d.total_marks, d.percentage, d.correct_answers);
        } else {
            toast(d.message || 'Submission failed', 'error');
            submitted = false;
        }
    })
    .catch(function(err) {
        console.error('Error:', err);
        toast('Network error: ' + err.message, 'error');
        submitted = false;
    });
}

function showCorrection(score, total, pct, correctDict, qIds) {
    document.getElementById('exam-mode').classList.add('hidden');
    document.getElementById('correction-mode').classList.remove('hidden');

    var passed = pct >= 50;
    var scoreClass = passed ? 'pass' : 'fail';

    var html = '<div class="correction-header glass">';
    html += '<h2><i class="fas fa-clipboard-check" style="color:var(--blue);margin-right:.4rem;"></i>Exam Correction</h2>';
    html += '<div class="score-circle ' + scoreClass + '">';
    html += '<div class="sc-val">' + score + '/' + total + '</div>';
    html += '<div class="sc-lab">' + pct.toFixed(1) + '%</div></div>';
    html += '<div class="corr-stats">';
    html += '<div class="corr-stat"><div class="cs-val" style="color:var(--green);">' + Object.keys(correctDict).length + '</div><div class="cs-lab">Correct</div></div>';
    html += '<div class="corr-stat"><div class="cs-val" style="color:var(--red);">' + (TOTAL - Object.keys(correctDict).length) + '</div><div class="cs-lab">Wrong</div></div>';
    html += '<div class="corr-stat"><div class="cs-val">' + TOTAL + '</div><div class="cs-lab">Total</div></div>';
    html += '</div></div>';

    var letters = ['A', 'B', 'C', 'D'];
    for (var i = 0; i < TOTAL; i++) {
        var q = QUESTIONS[i];
        var qid = String(q.id);
        var userAns = answers[qid] || '';
        var correctAns = correctDict[qid] || '';
        var isCorrect = (userAns === correctAns);

        html += '<div class="corr-q glass ' + (isCorrect ? 'correct' : 'wrong') + '">';
        html += '<span class="corr-badge ' + (isCorrect ? 'correct' : 'wrong') + '"><i class="fas ' + (isCorrect ? 'fa-check' : 'fa-times') + '"></i> ' + (isCorrect ? 'Correct' : 'Wrong') + '</span>';
        html += '<div class="q-num" style="margin-bottom:.5rem;">Question ' + (i + 1) + '</div>';
        html += '<div class="q-text" style="font-size:.95rem;margin-bottom:.75rem;">' + q.question_text + '</div>';

        if (!isCorrect && userAns) {
            var userOptIdx = letters.indexOf(userAns);
            var userOptText = [q.option_a, q.option_b, q.option_c, q.option_d][userOptIdx] || '';
            html += '<div class="corr-answer your-wrong"><i class="fas fa-times" style="margin-right:.3rem;"></i> Your answer: ' + userAns + ' - ' + userOptText + '</div>';
        }
        if (!userAns) {
            html += '<div class="corr-answer your-wrong"><i class="fas fa-minus-circle" style="margin-right:.3rem;"></i> Not answered</div>';
        }

        var correctOptIdx = letters.indexOf(correctAns);
        var correctOptText = [q.option_a, q.option_b, q.option_c, q.option_d][correctOptIdx] || '';
        html += '<div class="corr-answer correct-ans"><i class="fas fa-check" style="margin-right:.3rem;"></i> Correct answer: ' + correctAns + ' - ' + correctOptText + '</div>';
        html += '</div>';
    }

    html += '<div style="text-align:center;padding:2rem 0;display:flex;gap:1rem;justify-content:center;flex-wrap:wrap;">';
    html += '<a href="/exams/" class="btn btn-ghost"><i class="fas fa-arrow-left"></i> All Exams</a>';
    html += '<a href="/" class="btn btn-primary"><i class="fas fa-home"></i> Home</a>';
    html += '</div>';

    document.getElementById('correction-mode').innerHTML = html;
    window.scrollTo({ top: 0, behavior: 'smooth' });
}

function toast(msg, type) {
    var ic = { success: 'fa-check-circle', error: 'fa-times-circle' };
    var el = document.createElement('div');
    el.className = 'toast toast-' + (type || 'success');
    el.innerHTML = '<i class="fas ' + (ic[type] || 'fa-info-circle') + '"></i><span>' + msg + '</span>';
    document.getElementById('toast-container').appendChild(el);
    setTimeout(function () { el.classList.add('removing'); setTimeout(function () { el.remove(); }, 300); }, 3500);
}
</script>
</body>
</html>
